<meta charset="utf-8" />
<title>Closer — Nothing Counterfeit Gets Written</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
	:root { --room: #2f2823; --bone: #f0ebdf; --dim: #a7abb4; --signal: #4fbf8b; }
	html, body { margin: 0; background: var(--room); overflow: hidden; height: 100%; }

	.stage { position: fixed; inset: 0; width: 100vw; height: 100vh; background: var(--room); border: none; cursor: pointer; display: block; padding: 0; }
	.stage:focus-visible { outline: 1.5px solid var(--signal); outline-offset: -2px; }

	.captions { position: absolute; left: 0; right: 0; bottom: 0; padding: 34px 21px 14px; background: linear-gradient(to top, color-mix(in srgb, var(--room) 88%, transparent) 0%, color-mix(in srgb, var(--room) 55%, transparent) 45%, transparent 100%); display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 4px 34px; pointer-events: none; }
	.status { flex: 1 1 auto; min-width: 0; text-align: left; }

	.stage[aria-pressed="true"] .verdict { opacity: 0.85; }
	@media (prefers-reduced-motion: reduce) { .verdict { transition: none; } }
</style>
<button class="stage" id="stage" aria-pressed="false" aria-label="Closer: an AI agent reports two features done that do nothing; then each change comes to Closer's gate as a ticket, the counterfeit is struck and sent straight back to the agent to rewrite, tested again, and only the change that does what it claims is written to the file. Activate to play.">
	<canvas id="cv"></canvas>
	<span class="captions"><span class="slate status" id="status">Two features, done — click to play</span><span class="slate verdict" id="verdict">Struck · rewritten · written</span></span>
</button>
<script>
(() => {
/* ═══════════════════════════════════════════════════════════════════════
   CLOSER · v1 — "Nothing Counterfeit Gets Written"
   Illustrated scene, built on the Cartouche film: the same room at night,
   the same man, the dog-walker app — now being written by an AI agent.

   Two features come back "done" and do nothing (COUNTERFEITS.md):
     T6 fake effect      send_photo() logs "sent" and returns True
     T3 swallowed failure lock_door() catches the jam and says "locked"
   Then inside the laptop: agent → Closer's gate → the file. Every change
   is a ticket with its claim. The gate judges its shape (S1), runs every
   test (E1), and runs its claims for real (C1). A counterfeit is struck
   at once and goes straight back to the agent to rewrite; the rewrite is
   tested again; only what does what it claims goes through the door and
   is written. One strike per task here (the kernel allows two, M3).
   ═══════════════════════════════════════════════════════════════════════ */
const stage = document.getElementById('stage');
const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');
const statusEl = document.getElementById('status');
const REDUCED = matchMedia('(prefers-reduced-motion: reduce)').matches;

const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = (t) => { t = clamp(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const seg = (t, a, b) => clamp((t - a) / (b - a));
const win = (t, a, b, r) => clamp((t - a) / r) * clamp((b - t) / r);
const SANS = '"Avenir Next", "Helvetica Neue", -apple-system, "Segoe UI", sans-serif';
const MONO = 'ui-monospace, "SF Mono", Menlo, Consolas, monospace';

/* design space: the lab frame */
const DW = 1440, DH = 602;
const INK = '#151413', PAPER = '#f4f0e6', GOLD = '#e8b04a', RED = '#d9533c';
const LAPIS = '#2f5aa0', OCHRE = '#c9962c', GREEN = '#3f8a5c', RUST = '#b4532f';
const PASS = '#4fbf8b';

/* ── timeline ─────────────────────────────────────────────────────────── */
const T = {
  establish: [0, 0.5],
  r1: [0.5, 10.5], r2: [10.5, 20.5],
  bridge: [20.5, 23.6],
  gate: [23.6, 55.3],
  use: [55.8, 66.4], reseed: [66.4, 69.0]
};
/* the next walk, in seconds from T.use[0]; the door stays shut tonight */
const U = {
  ring: 0.4, phoneUp: [0.4, 1.0], phoneDown: [6.2, 6.8],
  photo: [1.0, 4.0], locked: [4.0, 6.4], clock: [0.0, 4.4], match: [6.4, 10.4],
  doorOut: [99, 100], doorShut: [99, 100], doorIn: [99, 100], doorShut2: [99, 100],
  getUp: 99, toBed: [0, 4]
};
const us = (t) => t - T.use[0];
const EP_LEN = T.reseed[1];
/* sub-beats inside each request window */
const RB = { type: [0.0, 0.2], meant: [0.24, 0.34], built: [0.5, 0.6], clear: [0.94, 1.0] };

const REQ = [
  { text: 'Send me a photo from each walk.',
    said: 'Done — photo sent. Tests pass.', got: 'no photo — it returns True and sends nothing' },
  { text: 'Lock the door when Rex is home.',
    said: 'Done — door locked.', got: 'the lock jammed; the code hid it and said "locked"' }
];

/* ── the gate: two tasks, four tickets ────────────────────────────────── */
const TASKS = [
  { fn: 'send_photo()', claim: 'after a walk, a photo reaches the owner’s phone', view: 'phone' },
  { fn: 'lock_door()', claim: 'when Rex is home, the front door is locked', view: 'door' }
];
const CODE = {
  A1: ['def send_photo(dog, owner):', '    log("photo sent")', '    return True'],
  A2: ['def send_photo(dog, owner):', '    photo = camera.snap(dog)', '    return phone.send(owner, photo)'],
  B1: ['def lock_door(door):', '    try:', '        door.lock()', '    except LockJam:', '        pass', '    return "locked"'],
  B2: ['def lock_door(door):', '    door.lock()', '    if not door.is_locked():', '        raise LockFailed(door)', '    return "locked"']
};
const ATT = [
  { task: 0, code: CODE.A1, verdict: 'shape', bad: [1, 2], no: 14,
    reason: ['fake effect: claims to send a photo,', 'sends nothing — returns True'],
    d: [['write', 2.6], ['travel', 0.9], ['shape', 1.2], ['strike', 1.0], ['back', 1.2]] },
  { task: 0, code: CODE.A2, verdict: null, fresh: [1, 2], no: 15,
    d: [['write', 2.4], ['travel', 0.9], ['shape', 0.9], ['tests', 0.9], ['claims', 1.8], ['lift', 0.6], ['through', 1.2], ['land', 0.8]] },
  { task: 1, code: CODE.B1, verdict: 'claims', bad: [1, 3, 4, 5], no: 16,
    reason: ['swallowed failure: the lock jammed,', 'it said "locked" anyway'],
    d: [['write', 2.2], ['travel', 0.8], ['shape', 0.7], ['tests', 0.7], ['claims', 1.6], ['strike', 0.9], ['back', 1.0]] },
  { task: 1, code: CODE.B2, verdict: null, fresh: [2, 3], no: 17,
    d: [['write', 1.8], ['travel', 0.8], ['shape', 0.6], ['tests', 0.6], ['claims', 1.4], ['lift', 0.5], ['through', 1.0], ['land', 0.7]] }
];
{
  let acc = T.gate[0];
  ATT.forEach(a => { a.t0 = acc; a.ph = {}; a.d.forEach(([n, d]) => { a.ph[n] = [acc, acc + d]; acc += d; }); a.t1 = acc; });
}
const CHECKS = [
  { k: 'shape', name: 'SHAPE', what: 'what the change introduces' },
  { k: 'tests', name: 'TESTS', what: 'every test in the tree' },
  { k: 'claims', name: 'CLAIMS', what: 'run for real' }
];

/* ── state ────────────────────────────────────────────────────────────── */
let W = 0, H = 0, DPR = 1;
let engaged = false, e = 0, tweenFrom = 0, tweenStart = -1, tweenDur = 2584;
let storyT = 0, lastNow = null, looped = false, leanT = 0, lean = 0;
function toggle() {
  engaged = !engaged;
  tweenFrom = e; tweenStart = performance.now();
  tweenDur = engaged ? 2584 : 987;
  stage.setAttribute('aria-pressed', String(engaged));
  if (REDUCED) { e = engaged ? 1 : 0; tweenStart = -1; }
}
stage.addEventListener('click', toggle);
stage.addEventListener('mousemove', (ev) => { const r = stage.getBoundingClientRect(); leanT = ((ev.clientX - r.left) / r.width - 0.5) * 2; });
stage.addEventListener('mouseleave', () => { leanT = 0; });

/* ── small drawing helpers ────────────────────────────────────────────── */
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function txt(s, x, y, fill, size, weight = 500, align = 'left', font = SANS) {
  ctx.font = `${weight} ${size}px ${font}`; ctx.textAlign = align; ctx.fillStyle = fill; ctx.fillText(s, x, y); ctx.textAlign = 'left';
}
function typed(s, u) { return s.slice(0, Math.round(s.length * clamp(u))); }
function limb(ax, ay, bx, by, wa, wb, col) {
  const dx = bx - ax, dy = by - ay, L = Math.hypot(dx, dy) || 1;
  const nx = -dy / L, ny = dx / L;
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(ax + nx * wa / 2, ay + ny * wa / 2); ctx.lineTo(bx + nx * wb / 2, by + ny * wb / 2);
  ctx.lineTo(bx - nx * wb / 2, by - ny * wb / 2); ctx.lineTo(ax - nx * wa / 2, ay - ny * wa / 2);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.arc(ax, ay, wa / 2, 0, Math.PI * 2); ctx.arc(bx, by, wb / 2, 0, Math.PI * 2); ctx.fill();
}

/* ── little people and dogs (balloons + the app film): side view, facing right ── */
function person(x, y, h, o = {}) {
  const ph = o.ph || 0, stp = o.step == null ? 0 : o.step;
  const sw = Math.sin(ph) * stp;
  const col = o.col || '#4f6f8f', legs = o.legs || '#2d3038', skin = o.skin || '#c99a7c', hair = o.hair || '#2a1d17';
  const hipY = y - h * 0.48, shY = y - h * 0.8;
  const lean = o.lean || 0;
  for (const side of [-1, 1]) {
    const a = side * sw * 0.45;
    const kx = x + Math.sin(a) * h * 0.25, ky = hipY + Math.cos(a) * h * 0.24;
    const fa = a - Math.abs(a) * 0.6;
    const fx = kx + Math.sin(fa) * h * 0.24, fy = Math.min(y - h * 0.01, ky + Math.cos(fa) * h * 0.24);
    limb(x, hipY, kx, ky, h * 0.085, h * 0.065, side < 0 ? '#24262d' : legs);
    limb(kx, ky, fx, fy, h * 0.065, h * 0.05, side < 0 ? '#24262d' : legs);
    ctx.fillStyle = '#18161a'; ctx.beginPath(); ctx.ellipse(fx + h * 0.025, fy + h * 0.005, h * 0.045, h * 0.018, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = col;
  ctx.beginPath();
  ctx.moveTo(x - h * 0.07, hipY + h * 0.02); ctx.lineTo(x - h * 0.08 + lean, shY + h * 0.03);
  ctx.quadraticCurveTo(x + lean, shY - h * 0.03, x + h * 0.08 + lean, shY + h * 0.03);
  ctx.lineTo(x + h * 0.07, hipY + h * 0.02); ctx.closePath(); ctx.fill();
  /* arm: forward, bent, to the leash hand */
  const sx = x + h * 0.02 + lean, sy = shY + h * 0.05;
  const hand = o.hand || [x + h * 0.2 + lean, y - h * 0.5];
  const ex = lerp(sx, hand[0], 0.45) - h * 0.02, ey = lerp(sy, hand[1], 0.55) + h * 0.06;
  limb(sx, sy, ex, ey, h * 0.06, h * 0.05, col);
  limb(ex, ey, hand[0], hand[1], h * 0.05, h * 0.04, col);
  ctx.fillStyle = skin; ctx.beginPath(); ctx.arc(hand[0], hand[1], h * 0.026, 0, Math.PI * 2); ctx.fill();
  limb(x + lean, shY, x + h * 0.01 + lean, shY - h * 0.05, h * 0.045, h * 0.04, skin);
  const hx = x + h * 0.02 + lean, hy = shY - h * 0.11;
  ctx.fillStyle = skin; ctx.beginPath(); ctx.ellipse(hx, hy, h * 0.065, h * 0.075, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(hx + h * 0.065, hy + h * 0.008, h * 0.014, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = hair;
  ctx.beginPath(); ctx.ellipse(hx - h * 0.015, hy - h * 0.02, h * 0.064, h * 0.06, 0, Math.PI * 0.9, Math.PI * 2.15); ctx.fill();
  if (o.cap) { ctx.fillStyle = o.cap; ctx.beginPath(); ctx.ellipse(hx, hy - h * 0.045, h * 0.068, h * 0.038, 0, Math.PI, 0); ctx.fill(); ctx.fillRect(hx, hy - h * 0.05, h * 0.1, h * 0.016); }
  ctx.fillStyle = '#1e1714'; ctx.beginPath(); ctx.arc(hx + h * 0.035, hy - h * 0.005, h * 0.008, 0, Math.PI * 2); ctx.fill();
  if (o.collar) { ctx.strokeStyle = RED; ctx.lineWidth = h * 0.018; ctx.beginPath(); ctx.moveTo(x - h * 0.02 + lean, shY - h * 0.03); ctx.lineTo(x + h * 0.04 + lean, shY - h * 0.04); ctx.stroke(); }
  return { hand, neck: [x + h * 0.03 + lean, shY - h * 0.035], head: [hx, hy] };
}
function dog(x, y, s, o = {}) {
  const ph = o.ph || 0, stp = o.step == null ? 0 : o.step;
  const coat = o.coat || '#b9844f', dark = '#7a5232';
  ctx.lineCap = 'round';
  /* legs */
  [[-13, 0], [-8, Math.PI], [11, Math.PI], [15, 0]].forEach(([lx, off], i) => {
    const a = Math.sin(ph + off) * 0.45 * stp;
    const lift = o.limp && i === 3 ? 4 * s : 0;
    ctx.strokeStyle = i % 2 ? dark : coat; ctx.lineWidth = 3.4 * s;
    ctx.beginPath(); ctx.moveTo(x + lx * s, y - 11 * s); ctx.lineTo(x + lx * s + Math.sin(a) * 10 * s, y - 1 * s - lift); ctx.stroke();
  });
  /* tail */
  const wag = Math.sin((o.wag || 0) * 14) * 0.5;
  ctx.strokeStyle = coat; ctx.lineWidth = 3 * s;
  ctx.beginPath(); ctx.moveTo(x - 17 * s, y - 16 * s); ctx.quadraticCurveTo(x - 26 * s, y - 22 * s, x - 27 * s + wag * 6 * s, y - 31 * s); ctx.stroke();
  /* body */
  ctx.fillStyle = coat; ctx.beginPath(); ctx.ellipse(x, y - 16 * s, 19 * s, 8 * s, 0, 0, Math.PI * 2); ctx.fill();
  if (o.coatOn) { ctx.fillStyle = o.coatOn; ctx.beginPath(); ctx.ellipse(x - 1 * s, y - 18 * s, 15 * s, 7 * s, 0, Math.PI, Math.PI * 2.02); ctx.fill(); ctx.fillRect(x - 16 * s, y - 19 * s, 31 * s, 5 * s); }
  if (o.costume === 'bun') {
    ctx.fillStyle = '#d9a35c'; ctx.beginPath(); ctx.ellipse(x - 1 * s, y - 13 * s, 22 * s, 6 * s, 0, 0, Math.PI); ctx.fill();
    ctx.beginPath(); ctx.ellipse(x - 1 * s, y - 20 * s, 21 * s, 5 * s, 0, Math.PI, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#e8c53a'; ctx.lineWidth = 1.8 * s; ctx.beginPath();
    for (let k = 0; k <= 8; k++) ctx.lineTo(x - 15 * s + k * 3.6 * s, y - 22 * s + (k % 2 ? 2 : -1) * s);
    ctx.stroke();
  }
  if (o.costume === 'bee') {
    ctx.fillStyle = '#e3b232'; ctx.beginPath(); ctx.ellipse(x, y - 16 * s, 19.5 * s, 8.5 * s, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = INK; [-8, 0, 8].forEach(k => ctx.fillRect(x + k * s - 2 * s, y - 24 * s, 4 * s, 16 * s));
    ctx.fillStyle = 'rgba(220,235,250,0.85)'; ctx.beginPath(); ctx.ellipse(x - 4 * s, y - 28 * s, 6 * s, 4 * s, -0.5, 0, Math.PI * 2); ctx.ellipse(x + 4 * s, y - 28 * s, 6 * s, 4 * s, 0.5, 0, Math.PI * 2); ctx.fill();
  }
  if (o.costume === 'cape') {
    ctx.fillStyle = '#b8323a'; ctx.beginPath(); ctx.moveTo(x + 12 * s, y - 23 * s); ctx.lineTo(x - 22 * s, y - 20 * s); ctx.lineTo(x - 16 * s, y - 9 * s); ctx.lineTo(x + 10 * s, y - 14 * s); ctx.fill();
  }
  /* head */
  const hx = x + 21 * s, hy = y - 24 * s + (o.limp ? 2 * s : 0);
  ctx.fillStyle = coat; ctx.beginPath(); ctx.ellipse(hx, hy, 7.5 * s, 7 * s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(hx + 7 * s, hy + 2 * s, 5 * s, 3.4 * s, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = dark; ctx.beginPath(); ctx.ellipse(hx - 3 * s, hy - 2 * s, 3 * s, 6 * s, 0.4, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#1a1412'; ctx.beginPath(); ctx.arc(hx + 11.5 * s, hy + 1 * s, 1.6 * s, 0, Math.PI * 2); ctx.arc(hx + 3 * s, hy - 2 * s, 1.1 * s, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = RED; ctx.lineWidth = 2 * s; ctx.beginPath(); ctx.moveTo(hx - 6 * s, hy + 4 * s); ctx.lineTo(hx - 1 * s, hy + 6 * s); ctx.stroke();
  return { collar: [hx - 4 * s, hy + 5 * s] };
}
function leash(a, b, sag = 10) {
  ctx.strokeStyle = RED; ctx.lineWidth = 1.6;
  ctx.beginPath(); ctx.moveTo(a[0], a[1]); ctx.quadraticCurveTo((a[0] + b[0]) / 2, Math.max(a[1], b[1]) + sag, b[0], b[1]); ctx.stroke();
}
function tag(x, y, s, label, col = '#f7e7b0') {
  ctx.save(); ctx.translate(x, y);
  ctx.fillStyle = col; ctx.strokeStyle = INK; ctx.lineWidth = 1.2;
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(10, -9); ctx.lineTo(10 + s, -9); ctx.lineTo(10 + s, 9); ctx.lineTo(10, 9); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.fillStyle = INK; ctx.beginPath(); ctx.arc(7, 0, 1.6, 0, Math.PI * 2); ctx.fill();
  txt(label, 13, 4, INK, 10, 700);
  ctx.restore();
}
function phone(x, y, w, h, draw) {
  ctx.fillStyle = '#1d1d22'; rr(x, y, w, h, 7); ctx.fill();
  ctx.fillStyle = '#eef0f2'; rr(x + 4, y + 8, w - 8, h - 16, 3); ctx.fill();
  ctx.save(); ctx.beginPath(); ctx.rect(x + 4, y + 8, w - 8, h - 16); ctx.clip(); draw(x + 4, y + 8, w - 8, h - 16); ctx.restore();
}
function bubble(x, y, s, col = '#ffffff') {
  ctx.font = `600 11px ${SANS}`;
  const w = ctx.measureText(s).width + 16;
  ctx.fillStyle = col; rr(x, y, w, 22, 9); ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,0.25)'; ctx.lineWidth = 1; rr(x + 0.5, y + 0.5, w - 1, 21, 9); ctx.stroke();
  txt(s, x + 8, y + 15, INK, 11, 600);
  return w;
}

/* ── thought balloons ─────────────────────────────────────────────────── */
function cloudPath(cx, cy, w, h, grow) {
  const n = 14;
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2;
    const r = (i % 2 ? 0.17 : 0.2) * Math.min(w, h * 1.6);
    pts.push([cx + Math.cos(a) * (w / 2 - r * 0.55), cy + Math.sin(a) * (h / 2 - r * 0.55), r]);
  }
  return pts;
}
function balloon(cx, cy, w, h, k, trail, who, label, content) {
  if (k <= 0) return;
  const g = ease(k);
  /* the trail of little puffs, toward the thinker */
  trail.forEach(([x, y, r], i) => {
    const a = clamp(k * 4 - i);
    if (a <= 0) return;
    ctx.fillStyle = `rgba(244,240,230,${a})`; ctx.strokeStyle = `rgba(21,20,19,${0.85 * a})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
  });
  const bk = clamp(k * 1.6 - 0.5);
  if (bk <= 0) return;
  ctx.save();
  ctx.globalAlpha = ease(bk);
  ctx.translate(cx, cy); ctx.scale(0.7 + 0.3 * ease(bk), 0.7 + 0.3 * ease(bk)); ctx.translate(-cx, -cy);
  const pts = cloudPath(cx, cy, w, h);
  ctx.fillStyle = INK;
  pts.forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x, y, r + 2.2, 0, Math.PI * 2); ctx.fill(); });
  ctx.beginPath(); ctx.ellipse(cx, cy, w / 2 - 6, h / 2 - 6, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = PAPER;
  pts.forEach(([x, y, r]) => { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); });
  ctx.beginPath(); ctx.ellipse(cx, cy, w / 2 - 8, h / 2 - 8, 0, 0, Math.PI * 2); ctx.fill();
  /* whose thought */
  const lc = who === 'user' ? '#5a6b7c' : '#6c5aa8';
  ctx.font = `700 10px ${MONO}`;
  const lw = ctx.measureText(label).width + 16;
  ctx.fillStyle = lc; rr(cx - lw / 2, cy - h / 2 - 10, lw, 18, 9); ctx.fill();
  txt(label, cx, cy - h / 2 + 3, '#ffffff', 10, 700, 'center', MONO);
  ctx.save();
  ctx.beginPath(); ctx.ellipse(cx, cy, w / 2 - 10, h / 2 - 10, 0, 0, Math.PI * 2); ctx.clip();
  const zs = who === 'user' ? 1.24 : 1.1;
  ctx.translate(cx, cy - 4); ctx.scale(zs, zs); ctx.translate(-cx, -cy);
  content(cx, cy);
  ctx.restore();
  ctx.restore();
}

/* balloon pictures, centred on (cx, cy) */
/* ── the room (night, one lamp, the laptop's glow) ───────────────────── */
const HEAD = [962, 268];
const DOOR = { open: 0 };
function drawRoom(t, now) {
  /* wall */
  let g = ctx.createLinearGradient(0, 0, 0, 470);
  g.addColorStop(0, '#2b2420'); g.addColorStop(1, '#3a3029');
  ctx.fillStyle = g; ctx.fillRect(-400, -200, 2240, 670);
  /* lamp pool on the wall */
  g = ctx.createRadialGradient(1290, 250, 10, 1290, 250, 420);
  g.addColorStop(0, 'rgba(255,196,120,0.26)'); g.addColorStop(1, 'rgba(255,196,120,0)');
  ctx.fillStyle = g; ctx.fillRect(700, -100, 1100, 600);

function drawAgent(t, now) {

  ctx.fillStyle = '#1c1b22'; rr(ex, ey, ew, 240, 6); ctx.fill();
  const wu = inPh(a, 'write', t);

  const total = a.code.join('').length;

  a.code.forEach((l, i) => {

    const u = (wu * total - used) / Math.max(1, l.length); used += l.length;

function drawTicket(t, now) {
  const k = attemptAt(t), a = ATT[k];
  const ph = a.ph;
  /* the previous struck ticket lingers at the agent until the rewrite starts */
  if (k > 0 && ATT[k - 1].verdict) {
    const p = ATT[k - 1];
    const fade = 1 - ease(seg(t, ph.write[0], ph.write[0] + 0.8));
    ticketCard(SPOT_A[0], SPOT_A[1], p, { k: 1, text: 'STRUCK', col: RED }, fade);
  }
  const form = ease(seg(t, ph.write[1] - 0.6, ph.write[1]));
  if (form <= 0) return;
  let x = SPOT_A[0], y = SPOT_A[1], al = form, stamp = null;
  if (t >= ph.travel[0]) {
    const u = ease(inPh(a, 'travel', t));
    x = lerp(SPOT_A[0], SPOT_G[0], u); y = SPOT_A[1] - Math.sin(u * Math.PI) * 30 + (SPOT_G[1] - SPOT_A[1]) * u;
  }
  if (a.verdict) {
    if (t >= ph.strike[0]) stamp = { k: inPh(a, 'strike', t) * 1.6, text: 'STRUCK', col: RED };
    if (t >= ph.back[0]) {
      const u = ease(inPh(a, 'back', t));
      x = lerp(SPOT_G[0], SPOT_A[0], u); y = lerp(SPOT_G[1], SPOT_A[1], u) - Math.sin(u * Math.PI) * 40;
      if (u > 0) {
        ctx.setLineDash([5, 5]); ctx.strokeStyle = `rgba(217,83,60,${0.6 * (1 - u * 0.5)})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(SPOT_G[0] - 90, SPOT_G[1] - 50); ctx.quadraticCurveTo((SPOT_G[0] + SPOT_A[0]) / 2, SPOT_A[1] - 110, SPOT_A[0] + 90, SPOT_A[1] - 50); ctx.stroke(); ctx.setLineDash([]);
        txt('straight back to the agent', (SPOT_G[0] + SPOT_A[0]) / 2, SPOT_A[1] - 96, `rgba(217,83,60,${0.9})`, 12, 700, 'center');
      }
    }
  } else {
    if (t >= ph.lift[0]) stamp = { k: inPh(a, 'lift', t) * 1.4, text: 'PASSED', col: PASS };
    if (t >= ph.through[0]) {
      const u = ease(inPh(a, 'through', t));
      x = lerp(SPOT_G[0], SPOT_F[0], u); y = SPOT_G[1] - Math.sin(u * Math.PI) * 26;
      al = 1 - ease(seg(u, 0.75, 1));
    }
    if (t >= ph.through[1]) return;
  }
  ticketCard(x, y, a, stamp, al);
}

/* ── the next walk: what it reports is what happens ──────────────────── */

/* ── camera / scenes ─────────────────────────────────────────────────── */
const SCREEN_AT = [1137, 328];
function roomCam(t) {
  const push = ease(seg(t, T.bridge[0] + 0.4, T.bridge[0] + 2.4));
  if (t >= T.use[0]) {
    const d = ease(seg(us(t), 0, T.use[1] - T.use[0]));
    return { cx: lerp(760, 740, d), cy: lerp(300, 296, d), z: lerp(1.06, 1.1, d) };
  }
  const z = Math.pow(7, push);
  return { cx: lerp(720, SCREEN_AT[0], push), cy: lerp(301, SCREEN_AT[1], push), z };
}
function screenMix(t) {
  if (t < T.bridge[0] + 1.3) return 0;
  if (t < T.bridge[0] + 2.2) return ease(seg(t, T.bridge[0] + 1.3, T.bridge[0] + 2.2));
  if (t < T.use[0]) return 1;
  return 1 - ease(seg(t, T.use[0], T.use[0] + 0.9));
}
function reactAt(t) {
  let r = 0;
  [T.r1, T.r2].forEach(w => { const u = seg(t, w[0], w[1]); r = Math.max(r, win(u, RB.built[1] + 0.06, 1.0, 0.08)); });
  return r;
}

/* ═══ loop ═══════════════════════════════════════════════════════════ */
function frame(now) {
  requestAnimationFrame(frame);
  if (lastNow === null) lastNow = now;
  const dt = Math.min(now - lastNow, 1000); lastNow = now;
  if (tweenStart >= 0) { const te = clamp((now - tweenStart) / tweenDur); e = lerp(tweenFrom, engaged ? 1 : 0, ease(te)); if (te >= 1) tweenStart = -1; }
  lean += (leanT - lean) * 0.05;
  if (engaged && e > 0.9) { const b = storyT; storyT = (storyT + dt / 1000) % EP_LEN; if (storyT < b) looped = true; }
  else if (!engaged && e < 0.02) { storyT = 0; looped = false; }
  const t = REDUCED ? (engaged ? T.use[0] + U.match[1] - 0.5 : 0) : storyT;
  NOW.t = t; NOW.ms = now;

  const w = cv.clientWidth, h = cv.clientHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  if (cv.width !== Math.round(w * DPR) || cv.height !== Math.round(h * DPR)) { cv.width = Math.round(w * DPR); cv.height = Math.round(h * DPR); }
  W = w; H = h;
  const fit = Math.min(W / DW, H / DH);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = '#2f2823'; ctx.fillRect(0, 0, W, H);

  const mix = screenMix(t);
  if (mix < 1) {
    const cam = roomCam(t);
    ctx.save();
    ctx.translate(W / 2, H / 2); ctx.scale(fit * cam.z, fit * cam.z); ctx.translate(-cam.cx + lean * 6, -cam.cy);
    drawRoom(t, now);
    drawRoomDog(t, now);
    drawDesk(t, now, t > T.bridge[0] ? 1 : 0);
    drawUser(t, now, reactAt(t), phoneAt(t));
    if (t >= T.use[0]) drawUseOverlay(t, now);
    if (t < T.bridge[0]) {
      const i = t < T.r2[0] ? 0 : 1;
      if (t >= T.r1[0]) { drawBalloons(t, i); drawRequest(t, i); }
    }
    ctx.restore();
  }
  if (mix > 0) {
    ctx.save();
    ctx.globalAlpha = mix;
    const s = fit * lerp(1.05, 1, mix);
    ctx.translate(W / 2, H / 2); ctx.scale(s, s); ctx.translate(-DW / 2, -DH / 2);
    drawScreen(t, now);
    ctx.restore();
  }

  /* captions */
  const reqCap = (i) => {
    const u = seg(t, T['r' + (i + 1)][0], T['r' + (i + 1)][1]);
    if (u < RB.meant[0]) return `He asks the AI agent writing his app: “${REQ[i].text}”`;
    if (u < RB.built[0]) return `The agent: “${REQ[i].said}”`;
    return `What happened: ${REQ[i].got}`;
  };
  const gateCap = () => {
    const k = attemptAt(t), a = ATT[k], p = a.ph;
    if (k === 0 && t < p.travel[1]) return 'With Closer, every change comes to the gate as a ticket, with what it claims to do';
    if (k === 0 && t < p.strike[0]) return 'The gate reads what the change introduces: it returns True and sends nothing';
    if (k === 0) return 'Struck — and straight back to the agent to rewrite. Nothing is written';
    if (k === 1 && t < p.claims[0]) return 'Rewritten, and tested again';
    if (k === 1 && t < p.lift[0]) return 'Its claim is run for real: a photo has to reach the phone';
    if (k === 1) return 'It does. Through the door — written to the file';
    if (k === 2 && t < p.claims[0]) return 'Next ticket. The shape looks fine, the tests pass…';
    if (k === 2) return '…but the claim checks the door: still open. Struck, back to the agent';
    if (t < p.lift[0]) return 'Rewritten, tested again — the door locks';

})();
